# Held-out test data for ayzek: a standalone fetch tool (KO, HL/HT, NZ) and
# the metadata-only survey behind the pre-registered protocol.
#
#     uv run heldout --help
#     uv run pytest
[project]
name = "ayzek-heldout"
version = "0.1.0"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
description = "Fetches ayzek replay datasets (KO, HL/HT, NZ) from FDSN services"
requires-python = ">=3.12"
dependencies = [
    "obspy>=1.5.0",
    "numpy>=2.0",
]

[project.scripts]
heldout = "heldout.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heldout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
